<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ead9">
  <title>絲庵譜プレーヤー｜絲庵</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf5e9;
      --paper-deep: #f4ead9;
      --card: rgba(255, 253, 247, .94);
      --ink: #332a22;
      --muted: #786c60;
      --brown: #6d4934;
      --brown-dark: #4a3023;
      --gold: #c99545;
      --gold-soft: #f2dfb7;
      --blue: #56809a;
      --blue-soft: #dceaf0;
      --red: #b65a4c;
      --line: #d9c9b4;
      --shadow: 0 10px 30px rgba(73, 49, 32, .1);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.9), transparent 36%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 16px 14px calc(122px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 54px;
      margin-bottom: 10px;
    }

    .brand { text-align: center; }
    .brand-kicker { margin: 0; color: var(--brown); font-size: 12px; letter-spacing: .18em; }
    .brand-title { margin: 2px 0 0; font-size: clamp(21px, 5vw, 30px); font-weight: 700; letter-spacing: .08em; }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--brown-dark);
      background: rgba(255,255,255,.7);
      cursor: pointer;
    }

    .icon-button:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(86,128,154,.35);
      outline-offset: 2px;
    }

    .card {
      border: 1px solid rgba(178, 153, 123, .45);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .score-summary {
      position: relative;
      overflow: hidden;
      padding: 16px 20px;
    }

    .score-summary::after {
      position: absolute;
      z-index: 0;
      top: -56px;
      right: -50px;
      width: 150px;
      height: 150px;
      border: 22px solid rgba(201,149,69,.12);
      border-radius: 50%;
      content: "";
    }

    .summary-main {
      position: relative;
      z-index: 2;
      min-height: 98px;
      padding-right: 112px;
    }

    .summary-shami {
      position: absolute;
      z-index: 1;
      top: 1px;
      right: 3px;
      width: 116px;
      height: 116px;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 5px 7px rgba(73, 49, 32, .16));
      user-select: none;
    }

    .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .song-title { position: relative; z-index: 1; margin: 0; font-size: clamp(27px, 5vw, 32px); line-height: 1.25; }

    .meta-row {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--brown-dark);
      background: #fffaf1;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .display-import-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
      font-family: system-ui, sans-serif;
    }

    .import-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .file-button {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 9px 14px;
      border: 1px solid var(--brown);
      border-radius: 13px;
      color: var(--brown-dark);
      background: #fffdf8;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    #file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 12px;
      margin-top: 7px;
    }

    .control-card { padding: 8px 16px 7px; }
    .control-card > .section-label { margin-bottom: 4px; }
    .section-label { margin: 0 0 13px; color: var(--brown-dark); font-size: 15px; font-weight: 700; }

    .number-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .number-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: #fffdf8;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .number-button[aria-pressed="true"] {
      border-color: var(--brown);
      color: white;
      background: var(--brown);
      box-shadow: 0 5px 12px rgba(74,48,35,.2);
    }

    .tempo-row {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 10px;
    }

    .step-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--brown-dark);
      background: #fffdf8;
      font-family: system-ui, sans-serif;
      font-size: 23px;
      cursor: pointer;
    }

    .tempo-main { text-align: center; }
    .tempo-value { display: block; color: var(--brown-dark); font-family: system-ui, sans-serif; font-size: 23px; font-weight: 800; line-height: 1; }
    .tempo-caption { display: block; margin-top: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 10px; line-height: 1.2; }
    .tempo-slider { display: block; width: 100%; height: 14px; margin: 0; accent-color: var(--brown); }

    .mix-control {
      display: grid;
      grid-template-columns: auto minmax(90px, 1fr) auto;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(178,153,123,.5);
      font-family: system-ui, sans-serif;
    }

    .mix-heading {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--brown-dark);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .mix-label { color: var(--brown-dark); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .mix-slider { width: 100%; height: 14px; margin: 0; accent-color: var(--blue); }
    .mix-value { grid-column: 1 / -1; margin-top: -3px; color: var(--muted); font-size: 10px; text-align: center; }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 5px;
      padding: 7px 13px;
      border-radius: 14px;
      color: #6b563b;
      background: #fff5dd;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.55;
    }

    .notice-mark { flex: 0 0 auto; font-size: 17px; line-height: 1.2; }

    .layer-card {
      min-width: 0;
    }

    .layer-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .layer-card .section-label { margin: 0; font-size: 15px; line-height: 1.25; }

    .layer-help {
      margin: 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 10.5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .layer-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .layer-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: #fffdf8;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .layer-toggle:has(input:checked) {
      border-color: var(--brown);
      background: #fff7e8;
      box-shadow: inset 0 0 0 1px rgba(109,73,52,.08);
    }

    .layer-toggle input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--brown);
    }

    .player-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
      margin: 14px 2px 6px;
    }

    .player-status h2 { margin: 0; color: var(--brown-dark); font-size: 19px; }
    .position-text { margin: 4px 0 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 13px; }
    .technique-counts { color: var(--muted); font-family: system-ui, sans-serif; font-size: 11px; text-align: right; }

    .score-frame {
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding: 14px 0 18px;
      border: 1px solid rgba(178,153,123,.58);
      border-radius: var(--radius);
      background: #fffdfa;
      box-shadow: var(--shadow);
      scrollbar-color: var(--gold) transparent;
    }

    .score-paper {
      position: relative;
      width: 864px;
      min-width: 864px;
      margin: 0 auto;
      padding: 0 14px 10px;
    }

    .score-sheet-head {
      position: relative;
      height: 66px;
      color: #17120f;
    }

    .score-sheet-title {
      position: absolute;
      top: 0;
      left: 50%;
      min-width: 130px;
      padding: 0 8px 5px;
      translate: -50% 0;
      border-bottom: 1px solid #3b322b;
      font-size: 25px;
      line-height: 1.25;
      text-align: center;
    }

    .score-sheet-meta {
      position: absolute;
      top: 20px;
      left: 0;
      display: flex;
      align-items: center;
      gap: 22px;
      color: #342a23;
      font-size: 17px;
      font-weight: 600;
    }

    .score-sheet-tuning { white-space: nowrap; }

    .score-system {
      position: relative;
      display: grid;
      grid-template-columns: 38px 1fr;
      grid-template-rows: 105px;
      min-height: 105px;
      margin-bottom: 0;
    }

    .score-system.has-lyrics { grid-template-rows: 105px 30px; min-height: 135px; }
    .score-system.has-vocal { grid-template-rows: 105px 50px; min-height: 155px; }
    .score-system.has-lyrics.has-vocal { grid-template-rows: 105px 30px 50px; min-height: 185px; }

    .score-system:last-child { margin-bottom: 0; }

    .string-labels {
      position: relative;
      z-index: 2;
      grid-column: 1;
      grid-row: 1;
      color: #746960;
      font-size: 10px;
      line-height: 1;
    }

    .string-label {
      position: absolute;
      right: 6px;
      translate: 0 -50%;
      white-space: nowrap;
    }

    .string-label[data-string="3"] { top: 22px; }
    .string-label[data-string="2"] { top: 54px; }
    .string-label[data-string="1"] { top: 86px; }

    .score-row {
      position: relative;
      z-index: 2;
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(var(--measure-count), minmax(0, 1fr));
      min-width: 0;
      padding: 0;
    }

    .lyrics-label {
      z-index: 2;
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      padding-right: 6px;
      color: #b18b75;
      font-size: 10px;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .lyrics-line {
      z-index: 2;
      grid-column: 2;
      grid-row: 2;
      align-self: stretch;
      overflow: hidden;
      min-width: 0;
      padding: 2px 0 0 8px;
      border-bottom: 1px solid #d7c3ad;
      color: #5c4639;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 25px;
      white-space: pre;
    }

    .vocal-label {
      z-index: 3;
      grid-column: 1;
      align-self: center;
      padding-right: 6px;
      color: #725f4d;
      font-size: 10px;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .vocal-track {
      position: relative;
      z-index: 3;
      grid-column: 2;
      display: grid;
      min-width: 0;
      height: 50px;
    }

    .vocal-measure { position: relative; min-width: 0; height: 50px; }

    .vocal-note {
      position: absolute;
      z-index: 5;
      top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 18px;
      height: 34px;
      translate: -50% 0;
      border-radius: 5px;
      color: var(--vocal-color, #222);
      background: #fffdfa;
      font-family: Arial, sans-serif;
      line-height: 1;
      transition: color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .vocal-note-value {
      position: relative;
      display: block;
      min-width: 15px;
      height: 18px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .vocal-note[data-duration="2"] .vocal-note-value::after,
    .vocal-note[data-duration="1"] .vocal-note-value::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      border-top: 1.4px solid currentColor;
      content: "";
    }

    .vocal-note[data-duration="1"] .vocal-note-value::before {
      position: absolute;
      right: 0;
      bottom: 3px;
      left: 0;
      border-top: 1.4px solid currentColor;
      content: "";
    }

    .vocal-note[data-kind="rest"] .vocal-note-value { font-size: 19px; font-weight: 700; }
    .vocal-note[data-kind="interjection"] .vocal-note-value { font-family: "Yu Gothic", sans-serif; }
    .vocal-string-mark { display: block; height: 10px; font-size: 10px; letter-spacing: 1px; line-height: 9px; }
    .vocal-note.is-playing { color: white; background: var(--blue); box-shadow: 0 0 0 3px rgba(86,128,154,.18); }

    .vocal-slur-layer {
      position: absolute;
      z-index: 4;
      top: 2px;
      left: 0;
      width: 100%;
      height: 16px;
      overflow: visible;
      pointer-events: none;
    }

    .vocal-slur-layer path { fill: none; stroke: #222; stroke-width: 1.4; stroke-linecap: round; }

    .writing-layer-svg {
      position: absolute;
      z-index: 8;
      top: 0;
      left: 0;
      overflow: visible;
      pointer-events: none;
    }

    .writing-layer-svg.writing-layer-underlay { z-index: 1; }

    .score-layer-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .measure {
      position: relative;
      height: 105px;
      transition: background .15s ease, box-shadow .15s ease;
    }

    .measure::before,
    .measure:last-child::after {
      position: absolute;
      z-index: 1;
      top: 22px;
      width: 1px;
      height: 65px;
      background: #4c433c;
      content: "";
      pointer-events: none;
    }

    .measure::before { left: 0; }
    .measure:last-child::after { right: 0; }
    .measure.is-current { background: rgba(242,223,183,.35); box-shadow: inset 0 -2px 0 var(--gold); }

    .string-line {
      position: absolute;
      right: 0;
      left: 0;
      height: 1px;
      background: #6f665f;
    }

    .string-line[data-string="3"] { top: 22px; }
    .string-line[data-string="2"] { top: 54px; }
    .string-line[data-string="1"] { top: 86px; }

    .score-symbol {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 26px;
      min-height: 23px;
      translate: -50% -50%;
      border-radius: 5px;
      color: #211a16;
      background: #fffdfa;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 16px;
      font-weight: 500;
      transition: transform .15s ease, color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .score-symbol[data-string="3"] { top: 22px; }
    .score-symbol[data-string="2"] { top: 54px; }
    .score-symbol[data-string="1"] { top: 86px; }
    .score-symbol.is-playing { color: white; background: var(--red); box-shadow: 0 0 0 3px rgba(182,90,76,.17); transform: scale(1.13); }

    .rest {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 18px;
      font-weight: 700;
    }

    .rest.is-playing { color: var(--brown-dark); background: var(--gold-soft); box-shadow: 0 0 0 4px rgba(201,149,69,.15); }

    .duration-underline {
      position: absolute;
      right: 5px;
      bottom: 1px;
      left: 5px;
      height: 2px;
      background: currentColor;
      box-shadow: 0 4px 0 currentColor;
    }

    .score-symbol[data-duration="2"] .duration-underline { box-shadow: none; }
    .score-symbol[data-duration="4"] .duration-underline { display: none; }

    .score-annotation {
      position: absolute;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 26px;
      min-height: 14px;
      translate: -50% 0;
      color: #211a16;
      white-space: nowrap;
    }

    .score-annotation[data-string="3"] { top: -8px; }
    .score-annotation[data-string="2"] { top: 24px; }
    .score-annotation[data-string="1"] { top: 56px; }

    .annotation-mark {
      color: #211a16;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
    }

    .annotation-mark[data-technique="true"] {
      color: var(--blue);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: 800;
    }

    .score-barline {
      position: absolute;
      z-index: 5;
      top: 22px;
      height: 65px;
      pointer-events: none;
    }

    .score-barline[data-edge="row-start"] { left: 0; }
    .score-barline[data-edge="internal"] { left: 0; }
    .score-barline[data-edge="row-end"] { right: 0; }

    .score-barline[data-kind="single"] {
      width: 1px;
      background: #403832;
    }

    .score-barline[data-kind="double"] {
      width: 5px;
      border-right: 1px solid #403832;
      border-left: 1px solid #403832;
    }

    .score-barline[data-kind="final"] {
      width: 6px;
      border-right: 3px solid #403832;
      border-left: 1px solid #403832;
    }

    .score-barline[data-kind="repeat-start"],
    .score-barline[data-kind="repeat-end"] {
      width: 5px;
    }

    .score-barline[data-kind="repeat-start"] {
      border-right: 1px solid #403832;
      border-left: 3px solid #403832;
    }

    .score-barline[data-kind="repeat-end"] {
      border-right: 3px solid #403832;
      border-left: 1px solid #403832;
    }

    .score-barline[data-edge="internal"][data-kind="double"],
    .score-barline[data-edge="internal"][data-kind="final"],
    .score-barline[data-edge="internal"][data-kind="repeat-end"] {
      translate: -100% 0;
    }

    .score-barline[data-kind="repeat-start"]::after,
    .score-barline[data-kind="repeat-end"]::after {
      position: absolute;
      top: 9px;
      color: #403832;
      content: "•\A•";
      font-family: system-ui, sans-serif;
      font-size: 7px;
      line-height: 24px;
      white-space: pre;
    }

    .score-barline[data-kind="repeat-start"]::after { left: 7px; }
    .score-barline[data-kind="repeat-end"]::after { right: 7px; }

    .measure.has-left-barline::before,
    .measure.has-right-barline:last-child::after {
      display: none;
    }

    .score-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 14px;
      margin: 8px 8px 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 11px;
    }

    .rest-key {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .rest-key-symbol {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 20px;
      color: #211a16;
      font-family: serif;
      font-size: 17px;
      font-weight: 700;
    }

    .rest-key-symbol::after {
      position: absolute;
      right: 2px;
      bottom: 1px;
      left: 2px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .rest-key-symbol[data-duration="4"]::after { display: none; }
    .rest-key-symbol[data-duration="1"]::after { box-shadow: 0 3px 0 currentColor; }

    .transport {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(134,111,83,.24);
      background: rgba(255,250,241,.94);
      box-shadow: 0 -8px 24px rgba(67,44,28,.12);
      backdrop-filter: blur(14px);
    }

    .transport-inner {
      display: grid;
      grid-template-columns: 50px minmax(150px, 260px) 50px;

      align-items: center;
      gap: 10px;

      display: grid;

      height: 50px;
      border: 1px solid var(--line);

      font-family: system-ui, sans-serif;
      font-size: 19px;
      cursor: pointer;
    }

      min-height: 56px;
      border: 0;
      border-radius: 18px;
      color: white;
      background: linear-gradient(145deg, #765039, #4d3325);

      font-weight: 800;

    }

    .toast {
      position: fixed;
      z-index: 50;
      top: 16px;
      left: 50%;
      width: min(430px, calc(100% - 28px));
      padding: 12px 15px;
      translate: -50% -130%;
      border-radius: 14px;
      color: white;
      background: #4b3c32;
      box-shadow: var(--shadow);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      transition: translate .22s ease, opacity .22s ease;
    }

    .toast.is-visible { translate: -50% 0; opacity: 1; }

    @media (min-width: 720px) {
      .app-shell { padding: 0 24px 132px; }
      .control-grid { grid-template-columns: 1fr 1fr; }

    @media (max-width: 560px) {
      .summary-main { padding-right: 92px; }
      .summary-shami { width: 100px; height: 100px; }

    @media (min-width: 1024px) {

    @media (prefers-reduced-motion: reduce) {

<body>

  <script>

"○"]]},{"m":22,"p":4,"d":2,"n":[[3,"7"]]},{"m":22,"p":6,"d":2,"n":[[3,"6"]]},{"m":23,"p":0,"d":4,"n":[[1,"○"]]},{"m":23,"p":4,"d":4,"n":[[2,"○"],[3,"4"]]},{"m":24,"p":0,"d":4,"n":[[0,"休"]]},{"m":24,"p":4,"d":4,"n":[[3,"6"],[2,"○"]]},{"m":25,"p":0,"d":4,"n":[[1,"○"]]},{"m":25,"p":4,"d":4,"n":[[3,"7"],[2,"○"]]},{"m":26,"p":0,"d":4,"n":[[0,"休"]]},{"m":26,"p":4,"d":4,"n":[[3,"6"],[2,"○"]]}];

    function assertElement(value, name) {
      if (!(value instanceof HTMLElement)) throw new Error(`${name} が見つかりません。`);
      return value;
    }

    Object.entries(els).forEach(([name, value]) => assertElement(value, name));

    function showToast(message) {
      window.clearTimeout(state.toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("is-visible");
